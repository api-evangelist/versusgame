components:
  schemas:
    ListUsersEntity:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/UserEntity'
      required:
      - items
    Role:
      type: string
      enum:
      - anonymous
      - ADMIN
      - CREATOR
      - USER
      - SUPER_ADMIN
      - AUTOGAME
      - DISTRIBUTION_MANAGER
      - MICROSOFT_REWARDS_USER
    SigninDto:
      type: object
      properties:
        email:
          type: string
        password:
          type: string
      required:
      - email
      - password
    Language:
      type: string
      enum:
      - en-us
      - es-mx
    PayoutEmailVerificationDto:
      type: object
      properties:
        code:
          type: string
      required:
      - code
    ResetPasswordDto:
      type: object
      properties:
        email:
          type: string
          format: email
        returnUrl:
          type: string
      required:
      - email
      - returnUrl
    SetRoleDto:
      type: object
      properties:
        role:
          allOf:
          - $ref: '#/components/schemas/Role'
      required:
      - role
    SetCreatorDto:
      type: object
      properties:
        avatarAssetId:
          type: string
        partnerName:
          type: string
        profileColor:
          type: string
        userName:
          type: string
      required:
      - avatarAssetId
      - partnerName
      - profileColor
      - userName
    UpdatePayoutEmailEntity:
      type: object
      properties:
        verified:
          type: boolean
      required:
      - verified
    MicrosoftRewardsDto:
      type: object
      properties:
        language:
          allOf:
          - $ref: '#/components/schemas/Language'
        returnUrl:
          type: string
        sourceDomain:
          type: string
      required:
      - returnUrl
      - sourceDomain
    ConfirmInviteDto:
      type: object
      properties:
        password:
          type: string
      required:
      - password
    ChangePasswordDto:
      type: object
      properties:
        oldPassword:
          type: string
        newPassword:
          type: string
      required:
      - oldPassword
      - newPassword
    UpdatePayoutEmailDto:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
    UpdateUserDto:
      type: object
      properties:
        isExemptFromSigningTos:
          type: boolean
      required:
      - isExemptFromSigningTos
    UserEntity:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        emailVerified:
          type: object
          default: false
        payoutEmail:
          type: string
        payoutEmailVerified:
          type: object
          default: false
        payoutEmailCode:
          type: string
        password:
          type: string
        resetPasswordSecret:
          type: string
        createdAt:
          type: object
        updatedAt:
          type: object
        signupIp:
          type: string
        lastTosSigned:
          type: number
        tosSignedAt:
          type: number
        isExemptFromSigningTos:
          type: object
          default: false
        blocked:
          type: boolean
        blockedReason:
          type: string
        deletedAt:
          type: number
        roles:
          type: object
        language:
          type: string
          enum:
          - en-us
          - es-mx
        externalId:
          type: object
      required:
      - id
      - emailVerified
      - payoutEmail
      - payoutEmailVerified
      - payoutEmailCode
      - createdAt
      - updatedAt
      - signupIp
      - lastTosSigned
      - tosSignedAt
      - isExemptFromSigningTos
      - roles
      - externalId
    CredentialsEntity:
      type: object
      properties:
        roles:
          type: array
          items:
            $ref: '#/components/schemas/Role'
        language:
          allOf:
          - $ref: '#/components/schemas/Language'
        accessToken:
          type: string
        accessTokenExpiresIn:
          type: number
        refreshToken:
          type: string
        lastTosSigned:
          type: boolean
        tosSignedAt:
          format: date-time
          type: string
        isExemptFromSigningTos:
          type: boolean
        userId:
          type: string
        email:
          type: string
        payoutEmail:
          type: string
      required:
      - roles
      - accessToken
      - accessTokenExpiresIn
      - refreshToken
      - lastTosSigned
      - tosSignedAt
      - isExemptFromSigningTos
      - userId
    ResetPasswordSetNewDto:
      type: object
      properties:
        password:
          type: string
      required:
      - password
    IdentifyExternalUser:
      type: object
      properties:
        language:
          allOf:
          - $ref: '#/components/schemas/Language'
        externalId:
          type: string
        sourceDomain:
          type: string
        distributorId:
          type: string
        returnUrl:
          type: string
        username:
          type: string
      required:
      - externalId
      - sourceDomain
      - distributorId
      - returnUrl
    ResendEmailVerificationDto:
      type: object
      properties:
        language:
          allOf:
          - $ref: '#/components/schemas/Language'
        userId:
          type: string
        email:
          type: string
          format: email
      required:
      - language
      - userId
      - email
    AdminInviteUserDto:
      type: object
      properties:
        language:
          allOf:
          - $ref: '#/components/schemas/Language'
        email:
          type: string
          format: email
        isExemptFromSigningTos:
          type: boolean
      required:
      - email
    SignupDto:
      type: object
      properties:
        language:
          allOf:
          - $ref: '#/components/schemas/Language'
        email:
          type: string
          format: email
        password:
          type: string
        returnUrl:
          type: string
        tosSigned:
          type: boolean
        birthday:
          format: date-time
          type: string
        username:
          type: string
        profileColor:
          type: string
        points:
          type: number
          minimum: 0
        sourceDomain:
          type: string
        distributorId:
          type: string
        referrerId:
          type: string
        referralCode:
          type: string
        amplitudeExperimentVariant:
          type: string
        externalId:
          type: string
        userId:
          type: string
      required:
      - email
      - returnUrl
      - tosSigned
      - sourceDomain
      - distributorId
    ValidateEmailDto:
      type: object
      properties:
        email:
          type: string
          format: email
      required:
      - email
  securitySchemes:
    access-token:
      scheme: bearer
      bearerFormat: JWT
      description: Enter the bearer token below (do not include 'Bearer')
      type: http
    x-api-key:
      type: apiKey
      in: header
      name: x-api-key
      description: API Key For External calls
