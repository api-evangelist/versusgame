  - name: access-token
    type: http bearer
    bearer_format: JWT
    header: 'Authorization: Bearer <jwt>'
    applies_to: user, creator, admin and superadmin operations (approximately 165 of 239 operations)
    note: >-
      The scheme description in the spec reads "Enter the bearer token below (do not include
      'Bearer')" - that is Swagger-UI input guidance; the wire format is a standard Authorization
      bearer header.
  - name: x-api-key
    type: apiKey
    in: header
    parameter: x-api-key
    applies_to: the /internal/* service-to-service operations only (InternalController_userInfo, InternalController_FindUsers)
  - name: refreshToken
    type: cookie/token requirement
    applies_to: AuthController_refresh, AuthController_logout, AuthController_changePassword
  social_login:
    protocol: OAuth 2.0 authorization code against third-party identity providers
    providers: [apple, google, facebook, microsoft]
    pattern: 'GET /auth/{provider} initiates; GET or POST /auth/{provider}/callback completes'
    note: VersusGame is the OAuth *client* here. It is not itself an OAuth authorization server, and declares no oauth2 securityScheme.
  see_also: authentication/versusgame-authentication.yml
