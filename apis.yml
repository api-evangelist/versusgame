apis:
- name: Versusgame API
  description: >-
    Production REST API for the Versus interactive gaming platform. 239 operations across 190 paths covering
    authentication (email/password plus Apple, Google, Facebook and Microsoft social login), games and gameplays,
    gamesets and gameset plays, leaderboards and prize awards, creator tooling (games, playlists, widgets, custom
    URLs), embeddable widget delivery, categories, products, assets, keyframes, wallets and ledger, Stripe and
    GCOW payments/payouts, meter ads, partner domains, notifications, profiles and personal information, plus the
    "autogame" AI pipeline (article ingestion, OpenAI chat completions, Google search, ElevenLabs/Polly speech,
    Remotion rendering). Bearer JWT for user/creator/admin calls and an x-api-key header for internal
    service-to-service calls. Twelve write operations require an x-idempotency-key.
