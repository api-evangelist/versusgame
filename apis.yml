aid: versusgame
name: VersusGame
description: >-
  VersusGame (branded "Versus") is an interactive gaming and audience-engagement company whose AI
  content-gamification engine turns publisher articles, live broadcasts and on-demand video into embeddable
  prediction games. Its flagship MiniGames product drops contextual, content-native games into partner sites
  via embed widgets, and its VersusLM AI system generates prediction games from arbitrary media. The platform
  layers real-time prediction, social competition, leaderboards, virtual wallets, coin/ticket economies, prize
  payouts and contextual "seamless ads" on top of partner content to drive longer sessions, repeat visits and
  incremental revenue. A single production REST API at api.versusgame.com exposes 239 operations across game
  creation, gameplays, gamesets, leaderboards, widgets, creators, playlists, wallets, ledger, payments/payouts
  and an autogame AI pipeline. Publicly named partners include ABC, Microsoft, Disney, BuzzFeed, Billboard,
  ESPN and UFC.
