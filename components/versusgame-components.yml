summary: >-
  VersusGame's core product is an embeddable client-side component - the MiniGames widget that
  publishers drop into an article or page. The widget delivery surface is visible and real in the
  API, but VersusGame publishes NO public integration guide, loader library, or embed-code reference:
  partners are provisioned directly. Everything below is derived from the OpenAPI and from observed
  hosts; no loader script URL or embed snippet is asserted, because none is published.
